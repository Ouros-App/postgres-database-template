name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'rerun-ci')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+'

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'rerun-ci'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate scaffold
        run: |
          test -f README.md
          test -f config.yaml
          test -f requirements.txt
          test -f scripts/apply_sql.py
          test -f sql/versionamento.sql

      - name: Test runner
        run: |
          python -m py_compile scripts/apply_sql.py
          python -m unittest discover -s tests -v

  sql:
    name: sql
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate migration naming
        run: |
          find sql -type f -name '*.sql' | sort | grep -q .
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          root = Path.cwd()
          db = yaml.safe_load((root / "config.yaml").read_text(encoding="utf-8"))["database"]
          sql_dir = root / db["sql_path"]
          names = [db["version_schema_file"]]
          for item in db.get("execution_order", []):
              name = item if isinstance(item, str) else item.get("file") if isinstance(item, dict) else None
              if not isinstance(name, str):
                  sys.exit("Invalid SQL file in execution_order")
              names.append(name)
          for name in names:
              path = Path(name)
              target = sql_dir / path
              if path.is_absolute() or ".." in path.parts or path.suffix != ".sql" or not target.is_file():
                  sys.exit(f"Invalid SQL file: {name}")
          PY

      - name: Block destructive SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r"\b(TRUNCATE|DROP\s+(DATABASE|TABLE|SCHEMA))\b", re.I)
          for path in Path("sql").rglob("*.sql"):
              sql = path.read_text(encoding="utf-8")
              sql = re.sub(r"/\*.*?\*/|--[^\n]*", " ", sql, flags=re.S)
              if pattern.search(sql):
                  sys.exit("Destructive SQL is forbidden")
          PY
